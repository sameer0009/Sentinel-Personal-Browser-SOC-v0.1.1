<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentinel SOC — Console</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img id="logo" alt="Sentinel">
      <div><h1>SENTINEL <span>SOC</span></h1><small>DEV-HUNTERS STUDIO · v<span id="ver"></span></small></div>
    </div>
    <nav class="nav" id="nav">
      <button data-tab="overview" class="active"><span class="ico">◉</span>Overview</button>
      <button data-tab="feed"><span class="ico">≋</span>Live Feed</button>
      <button data-tab="alerts"><span class="ico">⚠</span>Alerts<span class="badge" id="navAlertBadge" style="display:none">0</span></button>
      <button data-tab="sites"><span class="ico">🌐</span>Site Dossiers</button>
      <button data-tab="intel"><span class="ico">🔍</span>Intel Lookup</button>
      <button data-tab="reports"><span class="ico">📄</span>Reports</button>
      <button data-tab="settings"><span class="ico">⚙</span>Settings</button>
    </nav>
    <div class="side-foot" id="sideFoot">—</div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h2 id="pageTitle">Overview</h2>
      <p id="pageSub">Your personal security operations picture</p>
    </div>

    <section class="tabpage active" id="tab-overview"></section>
    <section class="tabpage" id="tab-feed"></section>
    <section class="tabpage" id="tab-alerts"></section>
    <section class="tabpage" id="tab-sites"></section>
    <section class="tabpage" id="tab-intel"></section>
    <section class="tabpage" id="tab-reports"></section>
    <section class="tabpage" id="tab-settings"></section>
  </main>
</div>
<script src="dashboard.js"></script>
</body>
</html>
